  .content{min-width:0}.card{padding:14px 16px;margin-bottom:10px;border-radius:14px}
  .section-head{margin-bottom:10px;min-height:54px;gap:12px}
  .section-icon{font-size:23px}.title-wrap{gap:9px}.section-title{font-size:20px}.section-sub{margin-top:2px;font-size:12px}
  .actions{gap:7px;flex-wrap:nowrap}.primary,.success,.warning,.outline{height:38px;padding:0 14px;border-radius:10px;white-space:nowrap}
  .crumbs{margin:0 0 10px;font-size:12px}
  .table th{padding:10px 12px}.table td{padding:10px 12px}
  .drop{margin-top:10px;padding:11px;min-height:0}.footer{padding:2px 0 6px}
  .storage{padding:12px;margin:12px 0 0;border-radius:12px}.storage h4{margin-bottom:10px}
  .storage-line{margin:5px 0}.bar{margin-top:8px}
}


/* v1.2.6 compact row actions */
.operation-menu{position:relative;display:inline-block}.operation-menu>summary{list-style:none}.operation-menu>summary::-webkit-details-marker{display:none}.operation-trigger{cursor:pointer}.operation-dropdown{position:absolute;right:0;top:calc(100% + 5px);min-width:120px;padding:5px;background:#fff;border:1px solid #dfe5ee;border-radius:9px;box-shadow:0 10px 28px rgba(30,55,95,.14);z-index:30}.menu-action{display:block;width:100%;border:0;background:transparent;text-align:left;border-radius:7px;padding:8px 10px;font-size:12px;color:#415069;cursor:pointer;white-space:nowrap}.menu-action:hover{background:#f3f7ff;color:#1677ff}.menu-action.danger{color:#df3434}.menu-action.danger:hover{background:#fff1f1;color:#d72f2f}.row-actions{position:relative}.operation-menu[open] .operation-trigger{background:#f3f7ff;color:#1677ff;border-color:#bcd0fa}
@media(max-width:700px){.operation-dropdown{position:fixed;right:12px;top:auto;min-width:140px}.operation-menu{position:relative}.row-actions{overflow:visible}}
/* v1.2.5 ultra-compact top header */
@media (min-width:951px){
  .topbar{height:48px;padding:0 20px}
  .brand{gap:7px}.logo{width:30px;height:30px;border-radius:9px}.logo svg{width:18px}
  .brand-name{font-size:18px;letter-spacing:-.4px}.tagline{font-size:12px;margin-left:2px}
  .top-actions{gap:6px}.top-search{width:min(330px,28vw);height:32px;border-radius:9px}
  .top-search input{height:32px;padding:0 11px;font-size:13px}.top-search-btn{width:36px;height:32px;font-size:21px}
  .icon-btn{width:34px;height:32px;border-radius:9px;font-size:18px}
  .settings-caret{width:34px}
  .settings-menu{top:44px}
}
@media (max-width:950px) and (min-width:761px){
  .topbar{height:60px;padding:0 14px}
  .logo{width:34px;height:34px}.logo svg{width:20px}.brand-name{font-size:20px}
  .top-search{width:250px;height:36px}.top-search input{height:36px}.top-search-btn{height:36px;width:40px}
  .icon-btn{height:36px;width:38px}
}

/* hide the old About view completely even if cached HTML is served */
#view-about,[data-view="about"]{display:none!important}

</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 18a5 5 0 1 1 1.4-9.8A7 7 0 0 1 21 10.5 4.5 4.5 0 0 1 19 19H7Z"/></svg></div><span class="brand-name">FileShare</span><span class="tagline">简单 · 安全 · 高效</span></div>
  <div class="top-actions">
    <div class="top-search"><input id="fileSearchTop" type="search" placeholder="搜索文件或文件夹…" autocomplete="off"><button id="fileSearchBtn" class="top-search-btn" title="搜索">⌕</button></div>
    <div class="settings-wrap">
      <button class="icon-btn settings-trigger" id="settingsTop" title="设置" aria-label="设置">⚙</button>
      <button class="icon-btn settings-caret" id="settingsCaret" title="打开设置菜单" aria-label="打开设置菜单">⌄</button>
      <div class="settings-menu" id="settingsMenu" role="menu">
        <div class="menu-title">管理设置</div>
        <button class="menu-item" data-menu-action="storage"><span class="menu-icon">▣</span>存储空间</button>
        <button class="menu-item" data-menu-action="guests"><span class="menu-icon">♧</span>来宾账号</button>
        <button class="menu-item" data-menu-action="shares"><span class="menu-icon">⌯</span>分享设置</button>
        <button class="menu-item" data-menu-action="system"><span class="menu-icon">⚙</span>系统设置</button>
        <div class="menu-divider"></div>
        <div class="menu-title menu-user-title">管理员</div>
        <button class="menu-item" data-menu-action="password"><span class="menu-icon">♢</span>修改密码</button>
        <button class="menu-item danger-item" data-menu-action="logout"><span class="menu-icon">↪</span>退出登录</button>
      </div>
    </div>
  </div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="nav-title">工作台</div>
  <nav>
    <button class="nav-item active" data-view="files"><span class="nav-icon">▣</span>文件管理</button>
    <button class="nav-item" data-view="shares"><span class="nav-icon">↗</span>分享管理</button>
  </nav>
  <div class="sidebar-spacer"></div>
  <div class="storage"><h4>存储空间</h4><div class="storage-line"><span>已使用</span><b id="storageUsed">计算中…</b></div><div class="storage-line"><span>文件数量</span><b id="fileCount">—</b></div><div class="bar"><i id="storageBar"></i></div></div>
</aside>
<main class="content">
<section class="view active" id="view-files">
<div class="card">
  <div class="section-head"><div><div class="title-wrap"><span class="section-icon">📁</span><div><h2 class="section-title">文件管理</h2><p class="section-sub">管理 /files 目录中的文件和文件夹</p></div></div></div>
  <div class="actions"><button class="primary" id="uploadBtn">↥ 上传文件</button><button class="success" id="folderBtn">▣ 上传文件夹</button><button class="warning" id="newFolderBtn">＋ 新建文件夹</button><button class="outline" id="refreshBtn">⟳</button></div></div>
  <div class="crumbs" id="crumbs"></div>
  <input id="fileInput" type="file" multiple hidden><input id="folderInput" type="file" webkitdirectory directory multiple hidden>
  <div class="table-wrap"><table class="table"><thead><tr><th class="sortable" data-file-sort="name">名称<span class="sort-arrow" id="sortNameArrow"></span></th><th>类型</th><th class="sortable" data-file-sort="size">大小<span class="sort-arrow" id="sortSizeArrow"></span></th><th class="sortable" data-file-sort="mtime">修改时间<span class="sort-arrow" id="sortMtimeArrow"></span></th><th style="text-align:right">操作</th></tr></thead><tbody id="fileRows"></tbody></table></div>
  <div class="pagination" id="filePager"></div>
  <div class="drop" id="dropZone">也可以把文件拖到这里上传</div>
</div></section>

<section class="view" id="view-shares">
<div class="card"><div class="section-head"><div><div class="title-wrap"><span class="section-icon">🔗</span><div><h2 class="section-title">分享管理</h2><p class="section-sub">查看、修改和取消所有分享链接</p></div></div></div><div class="actions"><input class="search" id="shareSearch" placeholder="搜索分享（名称/路径）"><button class="danger" id="batchCancelBtn">▣ 批量取消分享</button><button class="outline" id="shareRefresh">⟳ 刷新</button></div></div>
  <div class="table-wrap"><table class="table" style="min-width:1000px"><thead><tr><th><input class="check" type="checkbox" id="selectAll"></th><th>名称/路径</th><th>状态</th><th>密码</th><th>有效期</th><th>下载情况</th><th>创建时间</th><th style="text-align:right">操作</th></tr></thead><tbody id="shareRows"></tbody></table></div><div class="pagination" id="sharePager"></div>
</div></section>


<div class="footer">FileShare v1.2.6　|　💙 让文件分享更简单</div>
</main></div></div>

<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body></html>
